# fly.toml app configuration file generated for ai-guide-2 on 2026-07-28T20:11:48Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ai-guide-2'
primary_region = 'iad'

[build]
  [build.args]
    # Vite inlines VITE_-prefixed variables into the client bundle at BUILD
    # time, so `fly secrets set` cannot supply this one — secrets only reach a
    # running container. Passing it here is what makes a GitHub-triggered
    # deploy produce a working map, since such a build has no way to receive
    # `--build-arg` from a command line.
    #
    # This is a Mapbox PUBLIC `pk.` token. It is designed to be readable by
    # clients and already ships inside the JavaScript of every deployed build,
    # so putting it here does not expose anything a visitor could not read
    # from the bundle. Restrict it to your fly.dev hostname in the Mapbox
    # dashboard (Account → Tokens → URL restrictions) and it is safe to commit.
    #
    # REPLACE THIS with your token before deploying. Left as a placeholder
    # deliberately: committing your credential is your decision to make, not
    # mine, and a token in git history is meaningfully harder to withdraw than
    # one in a local file.
    VITE_MAPBOX_TOKEN = "pk.REPLACE_ME"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # The machine scales to zero when idle (below) to keep cost near zero for
  # a low-traffic phone-testing app. The tradeoff: the first request after
  # any idle period pays a cold start — machine boot plus Node startup,
  # several seconds — before /api/health responds. Expect that delay on the
  # first request of a live walk; it is not a bug to chase.
  min_machines_running = 0
  processes = ['app']

[[vm]]
  # A single value, not the previous contradictory pair (`memory = '1gb'`
  # alongside `memory_mb = 256`). 256 MB is sized for a static file server;
  # this process is Node running a generation pipeline that holds a Postgres
  # connection open and makes concurrent outbound calls to Wikidata,
  # Wikipedia, Overpass, Mapbox and the Anthropic API in the same request —
  # V8's own baseline footprint plus that fan-out does not fit in 256 MB
  # without risking an OOM-kill mid-generation. 1 GB gives it headroom.
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
